[package]
name = "usag8"
version = "0.1.0"
description = "Usag8 Linux usage monitor prototype"
authors = []
edition = "2021"

[lib]
name = "usag8_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
